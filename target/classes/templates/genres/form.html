<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Genre Form</title>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </head>
    <body>
        <nav>
            <a href="/books">Books</a>
            <a href="/genres">Genres</a>
            <a href="/publishers">Publishers</a>
        </nav>

        <h1 th:text="${genre.id == null ? 'Add Genre' : 'Edit Genre'}"></h1>

        <form th:action="${genre.id == null ? '/genres' : '/genres/update/' + genre.id}" th:object="${genre}" method="post">
            <label>Name
                <input th:field="*{name}" placeholder="Genre name"/>
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </label>
            <button type="submit">Save</button>
            <a href="/genres">Cancel</a>
        </form>
    </body>
</html>
