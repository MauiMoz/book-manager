<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Books</title>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </head>
    <body>
        <nav>
            <a href="/books">Books</a>
            <a href="/genres">Genres</a>
            <a href="/publishers">Publishers</a>
        </nav>

        <H1>Books</H1>
        <a href="/books/new">+ Add Book</a>

        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Genre</th>
                    <th>Publisher</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.title}"></td>
                <td th:text="${book.author}"></td>
                <td th:text="${book.genre != null ? book.genre.name : 'None'}"></td>
                <td th:text="${book.publisher != null ? book.publisher.name : 'None'}"></td>
                <td>
                    <a th:href="@{/books/edit/{id}(id=${book.id})}">Edit</a>
                    <a th:href="@{/books/delete/{id}(id=${book.id})}"
                       onclick="return confirm('Are you sure you want to delete this book?')"
                    >Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </body>
</html>
