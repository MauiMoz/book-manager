<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Publishers</title>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </head>
    <body>
        <nav>
            <a href="/books">Books</a>
            <a href="/genres">Genres</a>
            <a href="/publishers">Publishers</a>
        </nav>

        <h1>Publishers</h1>
        <a href="/publishers/new">+ Add Publisher</a>
        <p th:if="${errorMessage}"
           th:text="${errorMessage}"
           style="color: #e94560;">
        </p>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Street</th>
                    <th>City</th>
                    <th>Postal code</th>
                    <th>Nation</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            <tr th:each="pub : ${publishers}">
                <td th:text="${pub.name}"></td>
                <td th:text="${pub.address != null ? pub.address.street + ' ' + pub.address.number : 'None'}"></td>
                <td th:text="${pub.address != null ? pub.address.city : 'None'}"></td>
                <td th:text="${pub.address != null ? pub.address.postalCode : 'None'}"></td>
                <td th:text="${pub.address != null ? pub.address.nation : 'None'}"></td>
                <td>
                    <a th:href="@{/publishers/edit/{id}(id=${pub.id})}">Edit</a>
                    <a th:href="@{/publishers/delete/{id}(id=${pub.id})}"
                       onclick="return confirm('Are you sure you want to delete this book?')"
                    >Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </body>
</html>
