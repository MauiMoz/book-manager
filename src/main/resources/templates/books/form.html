<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Book Form</title>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </head>
    <body>
        <nav>
            <a href="/books">Books</a>
            <a href="/genres">Genres</a>
            <a href="/publishers">Publishers</a>
        </nav>

        <h1 th:text="${book.id == null ? 'Add Book' : 'Edit Book'}"></h1>

        <form th:action="${book.id == null ? '/books' : '/books/update/' + book.id}" th:object="${book}" method="post">
            <label>Title
                <input th:field="*{title}" placeholder="Title"/>
                <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </label>
            <label>Author
                <input th:field="*{author}" placeholder="Author"/>
                <span th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
            </label>
            <label>Genre
                <select th:field="*{genre}">
                    <option value="">-- None --</option>
                    <option th:each="g : ${genres}"
                            th:value="${g.id}"
                            th:text="${g.name}">
                    </option>
                </select>
            </label>
            <label>Publisher
                <select th:field="*{publisher}">
                    <option value="">-- None --</option>
                    <option th:each="p : ${publishers}"
                            th:value="${p.id}"
                            th:text="${p.name}">
                    </option>
                </select>
            </label>
            <button type="submit">Save</button>
            <a href="/books">Cancel</a>
        </form>
    </body>
</html>
