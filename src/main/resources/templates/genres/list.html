<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Genres</title>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </head>
    <body>
        <nav>
            <a href="/books">Books</a>
            <a href="/genres">Genres</a>
            <a href="/publishers">Publishers</a>
        </nav>
        <h1>Genres</h1>
        <a href="/genres/new">+ Add Genre</a>
        <p th:if="${errorMessage}"
           th:text="${errorMessage}"
           style="color: #e94560;">
        </p>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            <tr th:each="genre : ${genres}">
                <td th:text="${genre.name}"></td>
                <td>
                    <a th:href="@{/genres/edit/{id}(id=${genre.id})}">Edit</a>
                    <a th:href="@{/genres/delete/{id}(id=${genre.id})}"
                       onclick="return confirm('Are you sure you want to delete this genre?')"
                    >Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </body>
</html>
